name: build-ipa

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: |
          python3 - <<'PY'
          import base64, zipfile, io
          data = base64.b64decode(open('patch.b64','rb').read())
          zipfile.ZipFile(io.BytesIO(data)).extractall('.')
          print('patched')
          PY

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project QuietSign.xcodeproj -scheme QuietSign -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' CODE_SIGN_ENTITLEMENTS='' build 2>&1 | tee build.log

      - name: Package ipa
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QuietSign.app Payload/
          zip -qr QuietSign-unsigned.ipa Payload
          ls -lh QuietSign-unsigned.ipa

      - name: Report
        if: always()
        run: |
          {
            echo "run=${{ github.run_number }}"
            echo "build=${{ steps.build.outcome }}"
            echo '----- errors -----'
            grep -E 'error:' build.log | head -40 || true
            echo '----- tail -----'
            tail -20 build.log || true
          } > BUILD.txt
          cat BUILD.txt
          git config user.name ci
          git config user.email ci@local
          git add -f BUILD.txt
          git commit -m "ci: build ${{ github.run_number }}" || true
          git push origin HEAD:main || true

      - name: Release ipa
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          files: QuietSign-unsigned.ipa
