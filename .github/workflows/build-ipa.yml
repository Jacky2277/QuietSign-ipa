name: build-ipa

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          set -euxo pipefail
          {
            python3 - <<'PY'
          import base64, zipfile, io
          data = base64.b64decode(open('patch.b64','rb').read())
          zipfile.ZipFile(io.BytesIO(data)).extractall('.')
          print('patched ok')
          PY
            ls -R Shared QuietSign | head -30
            brew install xcodegen
            xcodegen generate
          } 2>&1 | tee setup.log

      - name: Build unsigned
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project QuietSign.xcodeproj -scheme QuietSign -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' CODE_SIGN_ENTITLEMENTS='' build 2>&1 | tee build.log

      - name: Package ipa
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QuietSign.app Payload/
          zip -qr QuietSign-unsigned.ipa Payload
          ls -lh QuietSign-unsigned.ipa

      - name: Report
        if: always()
        run: |
          {
            echo "run=${{ github.run_number }}"
            echo "build=${{ steps.build.outcome }}"
          } > BUILD.txt
          if [ -f build.log ]; then
            echo '----- build errors -----' >> BUILD.txt
            grep -E 'error:' build.log | head -40 >> BUILD.txt || true
            echo '----- build tail -----' >> BUILD.txt
            tail -25 build.log >> BUILD.txt || true
          else
            echo '----- setup tail -----' >> BUILD.txt
            tail -60 setup.log >> BUILD.txt || true
          fi
          cat BUILD.txt
          git config user.name ci
          git config user.email ci@local
          git add -f BUILD.txt
          git commit -m "ci: build ${{ github.run_number }}" || true
          git push origin HEAD:main || true

      - name: Release ipa
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          files: QuietSign-unsigned.ipa
