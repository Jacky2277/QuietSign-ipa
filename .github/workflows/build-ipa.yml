name: build-ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: |
          python3 - <<'PY'
          import base64, zipfile, io
          data = base64.b64decode(open('patch.b64','rb').read())
          zipfile.ZipFile(io.BytesIO(data)).extractall('.')
          print('patched')
          PY

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild -project QuietSign.xcodeproj -scheme QuietSign -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" build

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QuietSign.app Payload/
          zip -qr QuietSign-unsigned.ipa Payload
          ls -lh QuietSign-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuietSign-ipa
          path: QuietSign-unsigned.ipa
          retention-days: 30
